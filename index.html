<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>科研工作台</title>
<style>body{margin:0;background:#f5f7fb;font:10.5pt Arial,"宋体";color:#18233b}*{box-sizing:border-box}.top{background:white;padding:18px 3%;display:flex;gap:35px;align-items:center;border-bottom:1px solid #e5eaf2}.brand{font-size:18pt;font-weight:bold;color:#173c75}.nav button,.btn{border:0;background:white;padding:10px 14px;border-radius:8px;cursor:pointer}.nav button.on,.primary{background:#2476e8;color:white}.main{padding:20px 3%}.view{display:none}.view.on{display:block}.welcome,.card{background:white;border:1px solid #e6ebf2;border-radius:14px;margin-bottom:16px;overflow:hidden}.welcome{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{padding:18px;border:0;border-radius:12px;text-align:left;cursor:pointer}.stat:nth-child(1){background:#eaf3ff}.stat:nth-child(2){background:#fff3e4}.stat:nth-child(3){background:#eaf9f2}.stat:nth-child(4){background:#fff0f0}.stat b{display:block;font-size:26pt;margin-top:5px}.head{padding:15px 18px;display:flex;justify-content:space-between;border-bottom:1px solid #e8edf4}.head h2{margin:0;font-size:13.5pt}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 14px;border-bottom:1px solid #edf0f5;text-align:left}th{background:#f8fafc}th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{background:#eef5ff;color:#1768dc}.sortmark{font-size:9pt;color:#8b96a8;margin-left:4px}.empty{text-align:center;color:#999;padding:30px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.inside{padding:18px}.editor{min-height:320px;border:1px solid #dbe2ed;border-radius:9px;padding:13px;font:12pt/1.7 "宋体";outline:none}.file{padding:10px 0;border-bottom:1px solid #eee}.modal{display:none;position:fixed;inset:0;background:#10203d66;place-items:center}.modal.on{display:grid}.box{background:white;padding:22px;border-radius:14px;width:min(650px,94%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}.field input,.field select{padding:9px}.foot{text-align:right;margin-top:16px}.danger{color:#c33}.late{color:#c33;font-weight:bold}@media(max-width:800px){.top{display:block}.nav{overflow:auto;white-space:nowrap}.stats,.grid2{grid-template-columns:1fr 1fr}}</style>
<header class="top"><div class="brand">▣ 科研工作台</div><nav class="nav"><button class="on" data-v="home">首页</button><button data-v="submitted">已投稿</button><button data-v="review">外审中</button><button data-v="revision">返修中</button><button data-v="templates">投稿模板</button><button data-v="archive">归档管理</button></nav></header><main class="main">
<section id="home" class="view on"><div class="welcome"><h1>欢迎使用科研工作台</h1><div>记录、跟踪并集中管理科研投稿工作。</div><div class="stats"><button class="stat" onclick="show('submitted')">已投稿<b id="n1">0</b></button><button class="stat" onclick="show('review')">外审中<b id="n2">0</b></button><button class="stat" onclick="show('revision')">返修进行中<b id="n3">0</b></button><button class="stat">外审服务待处理<b id="n4">0</b></button></div></div><div class="card"><div class="head"><h2>外审服务待处理</h2><button class="btn primary" onclick="service()">＋ 添加事项</button></div><table><thead><tr><th>事项</th><th>期刊/来源</th><th>截止日期</th><th>剩余</th><th>操作</th></tr></thead><tbody id="services"></tbody></table></div></section>
<section id="submitted" class="view"></section><section id="review" class="view"></section><section id="revision" class="view"></section>
<section id="templates" class="view"><div class="grid2"><div class="card"><div class="head"><h2>模板文件</h2><input type="file" id="up" multiple></div><div class="inside"><p>支持任意格式文件上传、下载和删除。</p><div id="files"></div></div></div><div class="card"><div class="head"><h2>AI辅助</h2><button class="btn" onclick="document.execCommand('bold')"><b>B 加粗</b></button></div><div class="inside"><div id="ai" class="editor" contenteditable="true"></div><small>小四字体（12pt），自动保存。</small></div></div></div></section>
<section id="archive" class="view"><div class="card"><div class="head"><h2>稿件归档</h2></div><table><thead><tr><th>标题</th><th>期刊</th><th>链接</th><th>状态</th><th>操作</th></tr></thead><tbody id="archives"></tbody></table></div></section></main>
<div id="modal" class="modal"><div class="box"><h2>稿件信息</h2><div class="form"><input id="id" type="hidden"><label class="field full">标题<input id="title"></label><label class="field">期刊名<input id="journal"></label><label class="field">链接<input id="link"></label><label class="field">状态<select id="status" onchange="sync()"><option value="submitted">已投稿</option><option value="review">外审中</option><option value="revision">返修中</option><option value="accepted">已录用</option><option value="published">已发表</option><option value="rejected">拒稿</option><option value="withdrawn">撤稿</option></select></label><label class="field"><span id="dl">投稿日期</span><input id="date" type="date"></label><label class="field" id="df" style="display:none">返修截止日期<input id="deadline" type="date"></label></div><div class="foot"><button class="btn" onclick="modal.classList.remove('on')">取消</button><button class="btn primary" onclick="savePaper()">保存</button></div></div></div>
<script>
const $=s=>document.querySelector(s),K='rw2026',DAY=864e5;
function loadWorkbenchData(){
  try{
    const cur=localStorage.getItem(K);
    if(cur) return JSON.parse(cur);
    const old1=localStorage.getItem('researchWorkbenchV1');
    if(old1){
      const d=JSON.parse(old1);
      const migrated={papers:Array.isArray(d.papers)?d.papers:[],services:Array.isArray(d.services)?d.services:[]};
      localStorage.setItem(K,JSON.stringify(migrated));
      return migrated;
    }
    const oldP=localStorage.getItem('rw_papers');
    const oldS=localStorage.getItem('rw_services');
    if(oldP||oldS){
      const migrated={papers:oldP?JSON.parse(oldP):[],services:oldS?JSON.parse(oldS):[]};
      localStorage.setItem(K,JSON.stringify(migrated));
      return migrated;
    }
  }catch(e){console.warn('旧数据迁移失败',e)}
  return {papers:[],services:[]};
}
let x=loadWorkbenchData();
let sortState={submitted:{key:'date',dir:'desc'},review:{key:'date',dir:'desc'},revision:{key:'deadline',dir:'asc'}};const nm={submitted:'已投稿',review:'外审中',revision:'返修中',accepted:'已录用',published:'已发表',rejected:'拒稿',withdrawn:'撤稿'},act=['submitted','review','revision'];const today=()=>new Date().toISOString().slice(0,10),since=d=>d?Math.max(0,Math.floor((new Date().setHours(0,0,0,0)-new Date(d+'T00:00:00'))/DAY)):'—',left=d=>d?Math.ceil((new Date(d+'T00:00:00')-new Date().setHours(0,0,0,0))/DAY):null,esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function save(){localStorage.setItem(K,JSON.stringify(x));render()}function show(v){document.querySelectorAll('.view,.nav button').forEach(e=>e.classList.remove('on'));$('#'+v).classList.add('on');document.querySelector('[data-v="'+v+'"]').classList.add('on')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function link(u){return u?'<a target="_blank" href="'+(/^https?:/.test(u)?esc(u):'https://'+esc(u))+'">访问 ↗</a>':'—'}function sel(p){return '<select onchange="move(\''+p.id+'\',this.value)">'+Object.entries(nm).map(([k,n])=>'<option value="'+k+'" '+(p.status==k?'selected':'')+'>'+n+'</option>').join('')+'</select>'}function sortPapers(list,s){
  const st=sortState[s];
  return [...list].sort((a,b)=>{
    let av,bv;
    if(st.key==='duration'){
      av=Number(since(a.date)); bv=Number(since(b.date));
    }else if(st.key==='countdown'){
      av=left(a.deadline); bv=left(b.deadline);
      av=av==null?999999:av; bv=bv==null?999999:bv;
    }else{
      av=a[st.key]?new Date(a[st.key]+'T00:00:00').getTime():Number.MAX_SAFE_INTEGER;
      bv=b[st.key]?new Date(b[st.key]+'T00:00:00').getTime():Number.MAX_SAFE_INTEGER;
    }
    return (av-bv)*(st.dir==='asc'?1:-1);
  });
}
function sortBy(s,key){
  const st=sortState[s];
  if(st.key===key) st.dir=st.dir==='asc'?'desc':'asc';
  else{
    st.key=key;
    st.dir=(key==='countdown'||key==='deadline')?'asc':'desc';
  }
  render();
}
function sh(s,key,label){
  const st=sortState[s];
  const mark=st.key===key?(st.dir==='asc'?'▲':'▼'):'↕';
  return '<th class="sortable" onclick="sortBy(\\''+s+'\\',\\''+key+'\\')">'+label+' <span class="sortmark">'+mark+'</span></th>';
}
function section(s){let rows=sortPapers(x.papers.filter(p=>p.status==s),s).map(p=>'<tr><td>'+esc(p.title)+'</td><td>'+esc(p.journal)+'</td><td>'+link(p.link)+'</td><td>'+p.date+'</td>'+(s=='revision'?'<td>'+esc(p.deadline||'—')+'</td><td class="'+(left(p.deadline)<0?'late':'')+'">'+(left(p.deadline)==null?'—':left(p.deadline)>=0?left(p.deadline)+' 天':'逾期 '+Math.abs(left(p.deadline))+' 天')+'</td>':'<td>'+since(p.date)+' 天</td>')+'<td>'+sel(p)+'</td><td><button class="btn" onclick="edit(\''+p.id+'\')">编辑</button> <button class="btn danger" onclick="delp(\''+p.id+'\')">删除</button></td></tr>').join('');let timeHeads=s=='submitted'?sh(s,'date','投稿日期')+sh(s,'duration','投稿时长'):s=='review'?sh(s,'date','外审日期')+sh(s,'duration','外审时长'):sh(s,'date','返修开始日期')+sh(s,'deadline','截止日期')+sh(s,'countdown','倒计时');return '<div class="card"><div class="head"><h2>'+nm[s]+'</h2><button class="btn primary" onclick="openPaper(\''+s+'\')">＋ 新增稿件</button></div><div class="wrap"><table><thead><tr><th>标题</th><th>期刊名</th><th>链接</th>'+timeHeads+'<th>状态</th><th>操作</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" class="empty">暂无记录</td></tr>')+'</tbody></table></div></div>'}function render(){act.forEach(s=>$('#'+s).innerHTML=section(s));$('#n1').textContent=x.papers.filter(p=>p.status=='submitted').length;$('#n2').textContent=x.papers.filter(p=>p.status=='review').length;$('#n3').textContent=x.papers.filter(p=>p.status=='revision').length;$('#n4').textContent=x.services.length;$('#services').innerHTML=x.services.map((s,i)=>'<tr><td>'+esc(s.title)+'</td><td>'+esc(s.journal)+'</td><td>'+esc(s.deadline)+'</td><td>'+(left(s.deadline)??'—')+' 天</td><td><button class="btn danger" onclick="x.services.splice('+i+',1);save()">删除</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">暂无待处理事项</td></tr>';$('#archives').innerHTML=x.papers.filter(p=>!act.includes(p.status)).map(p=>'<tr><td>'+esc(p.title)+'</td><td>'+esc(p.journal)+'</td><td>'+link(p.link)+'</td><td>'+nm[p.status]+'</td><td><button class="btn" onclick="edit(\''+p.id+'\')">编辑</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">暂无归档稿件</td></tr>'}function sync(){let s=$('#status').value;$('#dl').textContent=s=='submitted'?'投稿日期':s=='review'?'外审日期':s=='revision'?'返修开始日期':'状态日期';$('#df').style.display=s=='revision'?'flex':'none'}function openPaper(s='submitted'){['#id','#title','#journal','#link','#deadline'].forEach(q=>$(q).value='');$('#status').value=s;$('#date').value=today();sync();$('#modal').classList.add('on')}function savePaper(){if(!$('#title').value.trim())return alert('请填写标题');let p={id:$('#id').value||Date.now().toString(),title:$('#title').value.trim(),journal:$('#journal').value.trim(),link:$('#link').value.trim(),status:$('#status').value,date:$('#date').value,deadline:$('#deadline').value},i=x.papers.findIndex(a=>a.id==p.id);i<0?x.papers.push(p):x.papers[i]=p;$('#modal').classList.remove('on');save()}function edit(id){let p=x.papers.find(a=>a.id==id);$('#id').value=p.id;$('#title').value=p.title;$('#journal').value=p.journal;$('#link').value=p.link;$('#status').value=p.status;$('#date').value=p.date;$('#deadline').value=p.deadline||'';sync();$('#modal').classList.add('on')}function delp(id){if(confirm('确定删除？')){x.papers=x.papers.filter(p=>p.id!=id);save()}}function move(id,s){let p=x.papers.find(a=>a.id==id);p.status=s;p.date=today();if(s!='revision')p.deadline='';save()}function service(){let t=prompt('待处理事项：');if(!t)return;let j=prompt('期刊/来源：')||'',d=prompt('截止日期 YYYY-MM-DD：')||'';x.services.push({title:t,journal:j,deadline:d});save()}$('#ai').innerHTML=localStorage.getItem('rw_ai')||'';$('#ai').oninput=()=>localStorage.setItem('rw_ai',$('#ai').innerHTML);$('#up').onchange=e=>{[...e.target.files].forEach(f=>{let r=new FileReader;r.onload=()=>{let a=JSON.parse(localStorage.getItem('rw_files')||'[]');a.push({name:f.name,data:r.result});try{localStorage.setItem('rw_files',JSON.stringify(a));files()}catch(e){alert('文件过大，本地存储空间不足')}};r.readAsDataURL(f)})};function files(){let a=JSON.parse(localStorage.getItem('rw_files')||'[]');$('#files').innerHTML=a.map((f,i)=>'<div class="file">'+esc(f.name)+'　<a download="'+esc(f.name)+'" href="'+f.data+'">下载</a>　<button class="btn danger" onclick="rm('+i+')">删除</button></div>').join('')}function rm(i){let a=JSON.parse(localStorage.getItem('rw_files')||'[]');a.splice(i,1);localStorage.setItem('rw_files',JSON.stringify(a));files()}render();files();</script>
